spring.application.name=biblioteca-api
server.port=8080

# =====================================================================
# Conexão com o SQL Server
# Os valores podem ser sobrescritos por variáveis de ambiente:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=biblioteca;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Biblioteca@2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =====================================================================
# JPA / Hibernate
# ddl-auto=update cria/atualiza as tabelas automaticamente na 1ª execução
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datas no formato yyyy-MM-dd no JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
